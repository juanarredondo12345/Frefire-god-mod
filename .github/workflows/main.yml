name: Build & Release APK

# Se activa cada vez que subes cambios (push) a cualquier rama
on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde la interfaz de GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Descarga el código fuente del repositorio
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Configura el entorno Java necesario para Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Da permisos de ejecución al script de construcción
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Limpia builds anteriores y construye la versión Debug
      - name: Clean and Build
        run: ./gradlew clean assembleDebug --info

      # 5. Verifica que el APK se haya generado correctamente
      - name: Verify APK
        run: ls -l app/build/outputs/apk/debug/

      # 6. Sube el APK generado como un archivo descargable (Artefacto)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: FreeFire-Aimbot-APK
          path: app/build/outputs/apk/debug/*.apk

      # Opcional: Si quieres que cree una "Release" automática con un tag
